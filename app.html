    <script>
      // 前端拦截方案2 start
      (function () {
        let path_name = window.location.pathname;
        if (path_name.startsWith("/detail")) {
          let bufferObj = window.getCookie("pathInfo");
          if (bufferObj) {
            let obj = JSON.parse(bufferObj);
            if (Number(obj[path_name]) < 4) {
              obj[path_name] = Number(obj[path_name]) + 1;
              window.setCookie("pathInfo", JSON.stringify(obj));
            } else if (!obj[path_name]) {
              obj[path_name] = 1;
              window.setCookie("pathInfo", JSON.stringify(obj));
            }
          } else {
            let obj = {};
            obj[path_name] = 1;
            window.setCookie("pathInfo", JSON.stringify(obj));
          }
        }
      })();
      function clearPathInfo() {
        let bufferObj = window.getCookie("pathInfo");
        if (bufferObj) {
          let obj = JSON.parse(bufferObj);
          obj[window.location.pathname] = 0;
          window.setCookie("pathInfo", JSON.stringify(obj));
        }
      }
      // 前端拦截方案2 end、

      // 前端拦截方案4 start
      // 未请求广告时上报Q_AR_NOT，只在key===""这个真正的"能不能请求广告"判断点
      // 上报（key==="first"是mounted时的配额初始化调用，返回值调用方也没用，
      // 不是真正的拦截点，不上报，避免噪音）
      function reportFunnelBlock(reason) {
        if (window.pushEventParamsToGtm) {
          window.pushEventParamsToGtm("Q_AR_NOT", { why_ad_block: reason });
        }
      }
      function handleRequestAdByChannel(key, val, req) {
        const searchParams = new URLSearchParams(window.location.search);
        const channel = searchParams.has("channel") ? searchParams.get("channel") : "";
        if (!window.getCookie("requestAdByChannel")) {
          if (req) {
            if (!key) reportFunnelBlock("detail_not_mounted");
            return false;
          }
          let buffer = {};
          buffer[channel] = {};
          buffer[channel][key] = val;
          setCookieTomorrow("requestAdByChannel", JSON.stringify(buffer));
        } else {
          try {
            let buffer = JSON.parse(window.getCookie("requestAdByChannel"));
            if (!buffer[channel]) {
              if (req) {
                if (!key) reportFunnelBlock("detail_not_mounted");
                return false;
              }
              buffer[channel] = {};
              buffer[channel][key] = val;
              setCookieTomorrow("requestAdByChannel", JSON.stringify(buffer));
            } else {
              if (req) {
                if (
                  !buffer[channel].first &&
                  buffer[channel]?.mounted &&
                  buffer[channel]?.query_ad &&
                  buffer[channel]?.click_ad
                ) {
                  buffer[channel].first = val;
                  setCookieTomorrow("requestAdByChannel", JSON.stringify(buffer));
                  return true;
                } else if (buffer[channel].first && buffer[channel].first !== "ok" && !key) {
                  // 2026-08-03修复：漏了buffer[channel].first这个真值校验，
                  // 会导致只要该channel有过任何不完整的历史交互(比如只打开过
                  // 详情页触发了mounted，从没真正走完query_ad+click_ad)，
                  // first一直是undefined，undefined!=="ok"为真，能直接绕过
                  // 漏斗检查请求到广告——这是本条规则最该防的路径(成本最低的
                  // 假量：只需批量打开详情页，不需要伪造点击/clickid)
                  // 本次暂不限制广告请求次数，先观察数据情况：完成过一次漏斗
                  // 后不再有当日3次配额用尽就拦截的逻辑，只做次数计数上报
                  buffer[channel].requestSeq = (buffer[channel].requestSeq || 1) + 1;
                  setCookieTomorrow("requestAdByChannel", JSON.stringify(buffer));
                  if (window.pushEventParamsToGtm) {
                    window.pushEventParamsToGtm("Q_AR", { ad_request_seq: buffer[channel].requestSeq });
                  }
                  return true;
                } else {
                  if (!key) {
                    if (!buffer[channel]?.mounted) {
                      reportFunnelBlock("detail_not_mounted");
                    } else if (!buffer[channel]?.query_ad) {
                      reportFunnelBlock("no_terms_shown");
                    } else if (!buffer[channel]?.click_ad) {
                      reportFunnelBlock("no_terms_click");
                    } else {
                      reportFunnelBlock("unknown");
                    }
                  }
                  return false;
                }
              } else {
                buffer[channel][key] = val;
                setCookieTomorrow("requestAdByChannel", JSON.stringify(buffer));
              }
            }
          } catch (e) {}
        }
      }
      // 前端拦截方案4 end

      //获取用户属性
      function getUserProperty() {
        const hi_user_source = getValueByURLOrCookie("hi_source");
        const hi_user_sub_site = getHostname();
        const hi_user_timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";
        const {
          hi_source_clid: hi_user_source_clid,
          hi_source_aid: hi_user_source_aid,
          hi_source_site: hi_user_source_site,
          hi_source_site_name: hi_user_source_site_name,
          hi_section_id: hi_user_section,
          hi_section_name: hi_user_section_name
        } = getInfoBySource(hi_user_source);
        return {
          hi_user_source,
          hi_user_sub_site,
          hi_user_timezone,
          hi_user_source_clid,
          hi_user_source_aid,
          hi_user_source_site,
          hi_user_source_site_name,
          hi_user_section,
          hi_user_section_name
        };
      }
      window.dataLayer = window.dataLayer || [];
      function legacyUUID() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          const r = (Math.random() * 16) | 0;
          const v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }
      let uuid = window.getCookie("hi_user_id");
      if (!uuid) {
        uuid = legacyUUID().replace(/-/g, "");
        window.setCookie("hi_user_id", uuid);
      }
      const userProperties = {
        ...getUserProperty(),
        hi_user_id: uuid,
        hi_channel_user: getValueByURLOrCookie("channel")
      };
      gtag("set", "user_properties", {
        ...userProperties
      });
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-Z3V1ZS36TP");

      //拦截fetch
      (function () {
        const { fetch: originalFetch } = window;
        window.fetch = async (...args) => {
          let [resource, config] = args;
          // console.log(args,'args');
          if (resource.includes("https://www.google-analytics.com/g/collect")) {
            for (let key in userProperties) {
              if (!resource.includes(`up.${key}=${userProperties[key]}`)) {
                resource = resource + `&up.${key}=${userProperties[key]}`;
              }
            }
          }
          // 发送请求
          return await originalFetch(resource, config);
        };
      })();
    </script>

    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const ttclid = searchParams.get("ttclid");
      if (ttclid) {
        window.setCookie("hi_ttclid", ttclid);
      }
      window.isLoadAd = false;
      (function () {
        let hiUid = window.getCookie("hi_user_id");
        if (!hiUid) {
          hiUid = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
            .replace(/[xy]/g, function (c) {
              const r = (Math.random() * 16) | 0;
              const v = c === "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            })
            .replace(/-/g, "");
          window.setCookie("hi_user_id", hiUid);
        }
        window.hiUid = hiUid;
      })();
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src =
        "https://wc.bunchthings.com/youknowwho.js?t=" +
        Date.now() +
        "&uid=" +
        encodeURIComponent(window.hiUid);
      document.body.appendChild(script);
      script.onload = () => {
        let eventLoadYouknowwho = new Event("loadYouknowwho");
        window.dispatchEvent(eventLoadYouknowwho);
        window.dataLayer = window.dataLayer || [];
        if (typeof window.pushEventToGTM === "function") {
          window.pushEventToGTM("Page_View_Ip", {
            hi_ip: window.youknowwho_ip || "unknown",
            hi_country: window.youknowwho_ip_country || "unknown"
          });
        }

        // 判断是否切换IP/城市（稳健版：解析不到城市不算变化，连续多次不一致+带过期时间才拉黑）
        (function () {
          const MAX_MISMATCH_BEFORE_BLOCK = 2; // 连续2次不一致才拉黑，不是1次就拉黑
          const BLOCK_EXPIRE_DAYS = 3; // 拉黑状态3天后自动恢复，不是永久
          const STATE_COOKIE_DAYS = 30; // 状态记录保留30天，足够覆盖判断周期

          const loadAdEvent = new Event("loadAd");
          const currentCity = window.city;

          if (!currentCity) {
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
            return;
          }

          let state = {};
          try {
            state = JSON.parse(window.getCookie("cityCheckState") || "{}");
          } catch (e) {
            state = {};
          }

          if (state.blockedAt && Date.now() - state.blockedAt > BLOCK_EXPIRE_DAYS * 24 * 60 * 60 * 1000) {
            state = {};
          }

          if (state.blockedAt) {
            window.isLoadAd = false;
            window.dispatchEvent(new Event("adGateCityBlocked"));
            return;
          }

          if (!state.city) {
            state.city = currentCity;
            state.mismatchCount = 0;
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
          } else if (state.city === currentCity) {
            state.mismatchCount = 0;
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
          } else {
            state.mismatchCount = (state.mismatchCount || 0) + 1;
            if (state.mismatchCount >= MAX_MISMATCH_BEFORE_BLOCK) {
              state.blockedAt = Date.now();
              window.isLoadAd = false;
              window.dispatchEvent(new Event("adGateCityBlocked"));
            } else {
              state.city = currentCity;
              window.isLoadAd = true;
              window.dispatchEvent(loadAdEvent);
            }
          }

          window.setCookie("cityCheckState", JSON.stringify(state), STATE_COOKIE_DAYS);
        })();
      };

      // clickid跨用户复用检测 + 进站IP/资源加载IP对比，请求Worker统一判断
      window.checkAdGate = function () {
        try {
          // clid存在性判断：真实通过TikTok/Facebook广告点击进入的用户，平台会
          // 自动附带ttclid/fbclid；URL和cookie都没有则大概率不是真实广告点击
          // 链路进入的，直接不请求广告，不需要再打Worker接口
          const hi_source = getValueByURLOrCookie("hi_source");
          const { hi_source_clid } = getInfoBySource(hi_source);
          if (!hi_source_clid || hi_source_clid === "unknown") {
            return Promise.resolve({ ok: false, ipMismatch: false, clickidUserCount: null, noClid: true });
          }
          return fetch("https://wc.bunchthings.com/api/ad-gate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uid: window.hiUid || "", clickid: hi_source_clid })
          })
            .then((res) => res.json())
            .then((data) => {
              // clickid跨用户复用：暂不拦截广告请求，真实阈值还没定，先只采集
              // 复用人数分布数据（2026-07-31起），不影响ok的判断
              if (data.clickidUserCount != null && window.pushEventParamsToGtm) {
                window.pushEventParamsToGtm("Clickid_Reuse_Observed", {
                  clickid_reuse_count: data.clickidUserCount
                });
              }
              return {
                ok: !data.block,
                ipMismatch: !!data.ipMismatch,
                clickidUserCount: data.clickidUserCount != null ? data.clickidUserCount : null
              };
            })
            .catch(() => ({ ok: true, ipMismatch: false, clickidUserCount: null })); // 请求失败默认放行，避免网络问题误杀
        } catch (e) {
          return Promise.resolve({ ok: true, ipMismatch: false, clickidUserCount: null });
        }
      };
    </script>
    <script>
      window.done = false;
      window.done1 = false;
      window.tarFired = false;

      // T_AR（Purchase）的统一触发出口，不管被beforeunload还是visibilitychange
      // 调用，都靠tarFired去重，保证一次页面生命周期内只上报一次
      function fireTAR() {
        if (window.tarFired) return;
        window.tarFired = true;
        window.trackEventToPixel("T_AR");
        if (typeof window.pushEventToGTM === "function") {
          window.pushEventToGTM("T_AR", {
            hi_country: window.youknowwho_ip_country || "unknown",
            hi_ip: window.youknowwho_ip || "unknown",
            hi_ttclid: ttclid || window.getCookie("hi_ttclid") || "unknown"
          });
        }
        handleDataMonitor();
      }

      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement;
        const activeSrc = activeElement.getAttribute("src");

        // afs埋点
        if (activeSrc && activeSrc.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
            // 记录"点了真正的广告"这个状态，供visibilitychange兜底判断用——
            // iOS上Meta内置浏览器点击广告跳转外部域名时beforeunload不可靠
            // 触发，这是独立于beforeunload的第二条检测路径
            window.__pendingAdClick = true;
            window.__pendingAdClickAt = Date.now();
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      // 焦点回来了但页面没有经历过hidden，说明只是碰了一下又划回来了，
      // 不是真的点广告离开，清掉待定状态，避免之后被无关的hidden事件误触发
      window.addEventListener("focus", () => {
        if (window.__pendingAdClick && document.visibilityState === "visible") {
          window.__pendingAdClick = false;
        }
      });

      window.addEventListener("beforeunload", () => {
        // 处理 AFS 广告埋点逻辑
        const activeElement = document.activeElement;
        const src = activeElement?.getAttribute("src") || "";

        // 上报全部广告点击埋点
        if (src.includes("afs/ads?") && activeElement.getAttribute("title")) {
          window.pushEventParamsToGtm("T_AR_ALL");
        }

        if (!window.done) {
          // 双词条埋点
          if (window.location.pathname.startsWith("/detail")) {
            if (
              src &&
              src.includes("afs/ads?") &&
              activeElement.getAttribute("id") === "master-1"
            ) {
              window.pushEventParamsToGtm("T_AC_FIRST");
            } else if (
              src &&
              src.includes("afs/ads/i/") &&
              activeElement.getAttribute("id") === "slave-1-1"
            ) {
              window.clearPathInfo();
              window.handleRequestAdByChannel("click_ad", 1);
              window.pushEventParamsToGtm("T_AC_SECOND");
              window.pushEventParamsToGtm("T_AC");
              TACChangeCookie();
            }
          }

          if (src.includes("afs/ads?")) {
            if (activeElement.getAttribute("title")) {
              fireTAR();
            } else {
              window.clearPathInfo();
              window.handleRequestAdByChannel("click_ad", 1);
              window.pushEventParamsToGtm("T_AC");
              TACChangeCookie();
            }
          } else if (
            src.includes("afs/ads/i/") &&
            !window.location.pathname.startsWith("/detail")
          ) {
            window.pushEventParamsToGtm("T_AG");
          }

          window.done = true;
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            window.done1 = false;
            window.tarFired = false;
            document.body.focus();
          }, 0);
        } else if (
          document.visibilityState === "hidden" &&
          window.__pendingAdClick &&
          Date.now() - window.__pendingAdClickAt < 3000
        ) {
          // 兜底路径：iOS上Meta内置浏览器点击广告后beforeunload不一定触发，
          // 靠blur记录的状态+页面变hidden判断用户是不是点广告离开了，
          // fireTAR内部有去重，不会和beforeunload重复上报
          fireTAR();
          window.__pendingAdClick = false;
        }
      });

      function HandleMessageTACANDTAR(e) {
        if (window.done1) {
          return;
        }
        const activeElement = document.activeElement;
        const src = activeElement?.getAttribute("src") || "";
        if (src.includes("afs/ads?")) {
          if (!activeElement.getAttribute("title")) {
            window.clearPathInfo();
            window.handleRequestAdByChannel("click_ad", 1);
            window.trackEventToPixel("T_AC_MSG");
            dataLayer.push({ event: "T_AC_MSG", hi_time: handleTACMSGToLoad() });
            window.done1 = true;
          }
        } else if (
          src &&
          src.includes("afs/ads/i/") &&
          activeElement.getAttribute("id") === "slave-1-1" &&
          window.location.pathname.startsWith("/detail")
        ) {
          window.clearPathInfo();
          window.handleRequestAdByChannel("click_ad", 1);
          window.trackEventToPixel("T_AC_MSG");
          dataLayer.push({ event: "T_AC_MSG", hi_time: handleTACMSGToLoad() });
          window.done1 = true;
        }
      }
      //TAC和TAR埋点监听消息
      window.addEventListener("message", (e) => {
        if (typeof e?.data === "string" && e?.data?.startsWith("FSXDC,.aCS:")) {
          HandleMessageTACANDTAR();
        }
      });
    </script>
    <script>
      // 临时调试面板：排查iOS Meta内置浏览器T_AR上报问题用，
      // 只有 ?hi_debug=1 时才生效，不影响正常用户。
      // 用sessionStorage记住调试状态，这样从详情页跳到搜索结果页
      // 等站内其他页面（不会带着hi_debug参数跳转）时，调试面板依然生效，
      // 直到关闭这个浏览器标签页/会话为止
      (function () {
        var isDebug = new URLSearchParams(location.search).get("hi_debug") === "1";
        if (isDebug) {
          try {
            sessionStorage.setItem("hi_debug", "1");
          } catch (e) {}
        } else {
          try {
            isDebug = sessionStorage.getItem("hi_debug") === "1";
          } catch (e) {}
        }
        if (!isDebug) return;

        // 日志实时写入localStorage（同步操作，哪怕页面几毫秒后就被
        // 跳转销毁，只要事件处理函数跑到了这一行，日志就已经落盘），
        // 这样真实跳到广告主外部网站这种"页面说没就没"的场景，
        // 点返回回来之后依然能看到跳转前最后一刻发生了什么
        var LOG_KEY = "hi_debug_log_v1";
        var historyLines = [];
        try {
          historyLines = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
        } catch (e) {}

        var panel = document.createElement("div");
        panel.style.cssText =
          "position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow-y:auto;" +
          "background:rgba(0,0,0,0.88);color:#0f0;font:11px/1.4 monospace;" +
          "z-index:2147483647;padding:6px;white-space:pre-wrap;pointer-events:auto;";
        document.body.appendChild(panel);

        var clearBtn = document.createElement("div");
        clearBtn.textContent = "[清空历史日志]";
        clearBtn.style.cssText = "color:#f66;text-decoration:underline;margin-bottom:4px;";
        clearBtn.addEventListener("click", function () {
          historyLines = [];
          try {
            localStorage.removeItem(LOG_KEY);
          } catch (e) {}
          panel.innerHTML = "";
          panel.appendChild(clearBtn);
        });
        panel.appendChild(clearBtn);

        // 先把之前保存的历史日志渲染出来
        historyLines.forEach(function (text) {
          var line = document.createElement("div");
          line.textContent = text;
          panel.appendChild(line);
        });

        function log(msg) {
          var t = new Date();
          var pad = function (n, l) {
            return String(n).padStart(l || 2, "0");
          };
          var ts =
            pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds()) + "." + pad(t.getMilliseconds(), 3);
          var text = "[" + ts + "] " + msg;

          historyLines.push(text);
          if (historyLines.length > 300) historyLines = historyLines.slice(-300);
          try {
            localStorage.setItem(LOG_KEY, JSON.stringify(historyLines));
          } catch (e) {}

          var line = document.createElement("div");
          line.textContent = text;
          panel.appendChild(line);
          panel.scrollTop = panel.scrollHeight;
        }

        log("=== 新页面加载 === href=" + location.href);
        log("UA=" + navigator.userAgent);
        panel.scrollTop = panel.scrollHeight;

        window.addEventListener("blur", function () {
          var el = document.activeElement;
          log(
            "blur | tag=" +
              (el ? el.tagName : "null") +
              " src=" +
              (el && el.getAttribute && el.getAttribute("src")) +
              " title=" +
              (el && el.getAttribute && el.getAttribute("title")) +
              " id=" +
              (el && el.getAttribute && el.getAttribute("id"))
          );
          setTimeout(function () {
            log("  -> after blur: __pendingAdClick=" + window.__pendingAdClick);
          }, 0);
        });

        window.addEventListener("focus", function () {
          log("focus | visibilityState=" + document.visibilityState);
          setTimeout(function () {
            log("  -> after focus: __pendingAdClick=" + window.__pendingAdClick);
          }, 0);
        });

        document.addEventListener(
          "visibilitychange",
          function () {
            log("visibilitychange -> " + document.visibilityState + " | __pendingAdClick=" + window.__pendingAdClick);
          },
          true
        );

        window.addEventListener("beforeunload", function () {
          log("beforeunload fired");
        });

        window.addEventListener("pagehide", function (e) {
          log("pagehide | persisted=" + e.persisted);
        });

        document.addEventListener(
          "click",
          function (e) {
            var link = e.target.closest && e.target.closest("a");
            log("click | target=" + e.target.tagName + (link ? " href=" + link.getAttribute("href") : ""));
          },
          true
        );

        if (typeof window.fireTAR === "function") {
          var _origFireTAR = window.fireTAR;
          window.fireTAR = function () {
            log("*** fireTAR() CALLED ***");
            return _origFireTAR.apply(this, arguments);
          };
        }
      })();
    </script>
  </body>
</html>
